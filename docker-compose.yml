version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: frontdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: frontdesk
      POSTGRES_USER: frontdesk_admin
      POSTGRES_PASSWORD: frontdesk_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk_admin -d frontdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
